<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente suave vertical (menos dramático) -->
    <linearGradient id="vGradSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(214, 88%, 52%)" />
      <stop offset="100%" stop-color="hsl(214, 88%, 44%)" />
    </linearGradient>

    <!-- Filtro de textura brushed metal muy suave -->
    <pattern id="brushed" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="0" y2="4" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
      <line x1="2" y1="0" x2="2" y2="4" stroke="rgba(0,0,0,0.02)" stroke-width="1" />
    </pattern>

    <!-- Sombra más natural -->
    <filter id="naturalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur" result="softShadow">
        <feFuncA type="linear" slope="0.18" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="softShadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brillo ligero central -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.4" />
      <stop offset="50%" stop-color="white" stop-opacity="0.1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Grupo con sombra suave -->
  <g filter="url(#naturalShadow)">
    <!-- V principal centrada y equilibrada -->
    <path d="M120 100 L220 380 L292 380 L392 100 H320 L256 300 L192 100 Z" fill="url(#vGradSoft)" />

    <!-- Textura brushed metal aplicada encima -->
    <path d="M120 100 L220 380 L292 380 L392 100 H320 L256 300 L192 100 Z" fill="url(#brushed)"
      opacity="0.25" />

    <!-- Brillo central sutil -->
    <path d="M192 110 L256 300 L320 110" fill="none" stroke="url(#shine)" stroke-width="4"
      stroke-linecap="round" />
  </g>
</svg>